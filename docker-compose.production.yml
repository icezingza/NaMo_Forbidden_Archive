version: '3.8'

services:
  namo:
    image: icezingza/namo:latest
    build:
      context: .
      dockerfile: Dockerfile
      # Multi-platform build (requires buildx or Docker Build Cloud)
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: namo-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Security
    security_opt:
      - no-new-privileges:true
    read_only_root_filesystem: false
    volumes:
      - /tmp:/tmp  # Writable temp only
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
