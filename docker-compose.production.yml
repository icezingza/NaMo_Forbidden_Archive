version: '3.9'

services:
  # ==================== TELEGRAM BOT ====================
  telegram-bot:
    build:
      context: ./projects-NaMo-Forbidden-Archive
      dockerfile: Dockerfile
    container_name: namo-acc-bot
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=8080
      - DEBUG=${DEBUG:-false}
      - LOG_DIR=/var/log/namo
      - USE_GCS=${USE_GCS:-false}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./logs/bot:/var/log/namo
      - ./sessions:/tmp/sessions
    depends_on:
      - redis
      - postgres
      - qdrant
    networks:
      - namo-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: namo-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cognitive}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cognitive}
      - POSTGRES_DB=${POSTGRES_DB:-namo_sessions}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - namo-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognitive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: namo-redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - namo-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== QDRANT VECTOR DB ====================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: namo-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant_config.yaml:/qdrant/config/production.yaml
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - namo-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - QDRANT_CONFIG_PATH=/qdrant/config/production.yaml

  # ==================== NEO4J GRAPH DB ====================
  neo4j:
    image: neo4j:5-enterprise
    container_name: namo-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j_secure_pass}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/var/lib/neo4j/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - namo-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== PROMETHEUS ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: namo-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - namo-network
    restart: always

  # ==================== GRAFANA ====================
  grafana:
    image: grafana/grafana:latest
    container_name: namo-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "3000:3000"
    networks:
      - namo-network
    restart: always
    depends_on:
      - prometheus

  # ==================== NGINX REVERSE PROXY ====================
  nginx:
    image: nginx:alpine
    container_name: namo-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - namo-network
    restart: always
    depends_on:
      - telegram-bot
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== BACKUP SERVICE ====================
  backup:
    image: ${BACKUP_IMAGE:-alpine:latest}
    container_name: namo-backup
    volumes:
      - postgres_data:/postgres_backup
      - redis_data:/redis_backup
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    environment:
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-86400}
      - POSTGRES_USER=${POSTGRES_USER:-cognitive}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cognitive}
    command: sh /backup.sh
    networks:
      - namo-network
    restart: always
    depends_on:
      - postgres
      - redis

networks:
  namo-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  prometheus_data:
  grafana_data:
  nginx_logs:
