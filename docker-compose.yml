# NaMo Forbidden Archive - Production-Ready Compose Stack
# Usage: docker compose up --pull always
# 
# Services:
#   - api (FastAPI main server on 8000)
#   - memory (Memory service on 8081)
#   - telegram-bot (Telegram async interface)
#   - slack-bot (Slack bolt adapter)
#   - redis (Session cache, rate limiting)
#   - postgres (Persistent cognitive state)
#   - qdrant (Vector embeddings)
#   - neo4j (Graph memory)

services:
  # === Core API Service ===
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: namo-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      MEMORY_API_URL: "http://memory:8081/store"
      EMOTION_API_URL: "http://emotion:8082/analyze"
      QDRANT_URL: "http://qdrant:6333"
      NEO4J_URI: "bolt://neo4j:7687"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://cognitive:cognitive@postgres:5432/cognition"
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    volumes:
      - ./web:/app/web:ro
      - ./Visual_Scenes:/app/Visual_Scenes:ro
      - ./Audio_Layers:/app/Audio_Layers:ro
      - ./learning_set:/app/learning_set:rw
    restart: unless-stopped
    networks:
      - namo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.namo.service=api"

  # === Memory Service (Vector + Graph Store) ===
  memory:
    build:
      context: .
      dockerfile: Dockerfile.memory
    container_name: namo-memory
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      PORT: "8081"
      QDRANT_URL: "http://qdrant:6333"
      NEO4J_URI: "bolt://neo4j:7687"
      PYTHONUNBUFFERED: "1"
    depends_on:
      - qdrant
      - neo4j
    volumes:
      - ./core/memory:/app/core/memory:ro
    restart: unless-stopped
    networks:
      - namo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # === Emotion Service (Optional) ===
  emotion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: namo-emotion
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      PORT: "8082"
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "uvicorn", "core.emotion_engine:app", "--host", "0.0.0.0", "--port", "8082"]
    restart: unless-stopped
    networks:
      - namo-network

  # === Telegram Bot Service ===
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: namo-telegram
    env_file:
      - .env
    environment:
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      BACKEND_URL: "http://api:8000"
      MEMORY_API_URL: "http://memory:8081/store"
      PYTHONUNBUFFERED: "1"
    command: ["python", "telegram_bot.py"]
    depends_on:
      api:
        condition: service_healthy
      memory:
        condition: service_started
    restart: unless-stopped
    networks:
      - namo-network
    profiles:
      - with-bots

  # === Slack Bot Service ===
  slack-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: namo-slack
    ports:
      - "8090:3000"
    env_file:
      - .env
    environment:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET}"
      BACKEND_URL: "http://api:8000"
      PYTHONUNBUFFERED: "1"
    command: ["python", "slack_bot.py"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - namo-network
    profiles:
      - with-bots

  # === Redis (Session Cache & Rate Limiter) ===
  redis:
    image: redis:7-alpine
    container_name: namo-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - namo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # === PostgreSQL (Persistent State) ===
  postgres:
    image: postgres:16-alpine
    container_name: namo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cognitive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cognitive-change-me}
      POSTGRES_DB: cognition
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - namo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognitive"]
      interval: 10s
      timeout: 5s
      retries: 3

  # === Qdrant (Vector Database) ===
  qdrant:
    image: qdrant/qdrant:latest
    container_name: namo-qdrant
    ports:
      - "6333:6333"
    environment:
      QDRANT_API_KEY: "${QDRANT_API_KEY:-test-key}"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - namo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # === Neo4j (Graph Memory) ===
  neo4j:
    image: neo4j:5-alpine
    container_name: namo-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-namo-password-change-me}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1024m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    networks:
      - namo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 3

# === Volumes ===
volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

# === Networks ===
networks:
  namo-network:
    driver: bridge
