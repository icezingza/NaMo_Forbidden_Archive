# Full local stack for NaMo Forbidden Archive with Telegram Bot.
#   docker compose up --build
# Requires a .env file at the repo root (copy from .env.example first).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8005:8000"
    env_file:
      - .env
    environment:
      # server.py CMD uses ${PORT:-8080}; pin it to the mapped port
      - PORT=8000
      # reach the memory service over the compose network.
      # server.py POSTs directly to this URL, so it must include the /store path.
      - MEMORY_API_URL=http://memory:8081/store
    depends_on:
      - memory
    restart: unless-stopped
    networks:
      - namo-network

  memory:
    build:
      context: .
      dockerfile: Dockerfile.memory
    ports:
      - "8085:8081"
    env_file:
      - .env
    environment:
      # Dockerfile.memory CMD uses $PORT with no default — must be set
      - PORT=8081
    restart: unless-stopped
    networks:
      - namo-network

  # --- Telegram Bot Service ---
  telegram-bot:
    build:
      context: projects-NaMo-Forbidden-Archive
      dockerfile: Dockerfile
    ports:
      - "8086:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - BACKEND_URL=http://api:8000
      - MEMORY_API_URL=http://memory:8081/store
    depends_on:
      - api
      - memory
      - redis
      - qdrant
    restart: unless-stopped
    networks:
      - namo-network

  # --- Optional backing services for the ASI engines (core/engines/*) ---
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cognitive
      POSTGRES_PASSWORD: cognitive
      POSTGRES_DB: cognition
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - namo-network

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - namo-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - namo-network

  neo4j:
    image: neo4j:latest
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - namo-network

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:

networks:
  namo-network:
    driver: bridge
