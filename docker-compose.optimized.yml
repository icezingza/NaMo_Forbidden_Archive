version: '3.9'

services:
  namo-optimized:
    image: namo-optimized:latest
    container_name: namo-optimized-prod
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - namo-network

  namo-lean:
    image: namo-lean:latest
    container_name: namo-lean-prod
    ports:
      - "8001:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - namo-network
    profiles:
      - lean

  namo-alpine:
    image: namo-alpine:latest
    container_name: namo-alpine-prod
    ports:
      - "8002:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - namo-network
    profiles:
      - alpine

networks:
  namo-network:
    driver: bridge
