name: Docker Compose Integration Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docker-compose:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cognitive
          POSTGRES_PASSWORD: cognitive
          POSTGRES_DB: cognition
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services
        run: |
          # The production compose file requires .env, but this smoke test does
          # not need credentials because it starts only the local API services.
          touch .env
          docker compose build api memory

      - name: Start services
        run: |
          docker compose up -d --wait api memory

      - name: Check API health
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8005/v1/health && break
            sleep 1
          done || exit 1

      - name: Check memory service health
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8085/health && break
            sleep 1
          done || exit 1

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
