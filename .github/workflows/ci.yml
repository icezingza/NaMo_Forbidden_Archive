name: NaMo ACC CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Run pytest
        run: pytest --cov=.

  build-docker:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build main Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build memory Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.memory
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Telegram bot Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./projects-NaMo-Forbidden-Archive
          file: ./projects-NaMo-Forbidden-Archive/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
