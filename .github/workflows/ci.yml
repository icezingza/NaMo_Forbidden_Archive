name: NaMo ACC CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Docker Hub credentials for main publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          test -n "$DOCKER_HUB_USERNAME" || { echo "DOCKER_HUB_USERNAME is required for main publishing" >&2; exit 1; }
          test -n "$DOCKER_HUB_TOKEN" || { echo "DOCKER_HUB_TOKEN is required for main publishing" >&2; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Run pytest
        run: pytest --cov=. --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          touch .env
          docker compose config

  compose-integration:
    runs-on: ubuntu-latest
    needs: [validate-compose]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cognitive
          POSTGRES_PASSWORD: cognitive
          POSTGRES_DB: cognition
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services
        run: |
          # The production compose file requires .env, but this smoke test does
          # not need credentials because it starts only the local API services.
          touch .env
          docker compose build api memory

      - name: Start services
        run: |
          docker compose up -d --wait api memory

      - name: Check API health
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8000/v1/health && break
            sleep 1
          done || exit 1

      - name: Check memory service health
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8081/health && break
            sleep 1
          done || exit 1

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  docker-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, memory]
        include:
          - service: api
            dockerfile: Dockerfile
            import_target: server
            port: 8000
            health_path: /v1/health
          - service: memory
            dockerfile: Dockerfile.memory
            import_target: memory_service
            port: 8081
            health_path: /health
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: namo-${{ matrix.service }}:test

      - name: Test Docker image startup
        run: docker run --rm --entrypoint python namo-${{ matrix.service }}:test -c "import ${{ matrix.import_target }}"

      - name: Test container health endpoint
        run: |
          docker run -d --name namo-${{ matrix.service }}-health-test -p ${{ matrix.port }}:${{ matrix.port }} namo-${{ matrix.service }}:test &
          sleep 5
          for i in {1..10}; do
            if curl -f http://localhost:${{ matrix.port }}${{ matrix.health_path }} 2>/dev/null; then
              echo "Health check passed for ${{ matrix.service }}"
              docker kill namo-${{ matrix.service }}-health-test || true
              exit 0
            fi
            echo "Health check attempt $i/10 for ${{ matrix.service }}"
            sleep 2
          done
          echo "Health check failed for ${{ matrix.service }}"
          docker kill namo-${{ matrix.service }}-health-test || true
          exit 1

      - name: Generate SBOM (Software Bill of Materials)
        uses: docker/scout-action@v1
        with:
          command: sbom
          image: namo-${{ matrix.service }}:test
          format: spdx-json
          output: sbom-${{ matrix.service }}.spdx.json
        continue-on-error: true

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          if-no-files-found: warn

      - name: Scan with Docker Scout (CVE)
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: cves
          image: namo-${{ matrix.service }}:test
          only-severities: critical,high

      - name: Generate Scout comparison report (PR only)
        uses: docker/scout-action@v1
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          command: compare
          image: namo-${{ matrix.service }}:test
          to: ${{ github.base_ref }}

  docker-push:
    needs: [test, validate-compose, compose-integration, docker-build-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_TOKEN != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and push main image
        if: env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/namo-api:latest
            ${{ env.DOCKER_HUB_USERNAME }}/namo-api:${{ github.sha }}

      - name: Build and push memory image
        if: env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.memory
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/namo-memory:latest
            ${{ env.DOCKER_HUB_USERNAME }}/namo-memory:${{ github.sha }}

      - name: Run Docker Scout on pushed images
        if: env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_TOKEN != ''
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: cves
          image: ${{ env.DOCKER_HUB_USERNAME }}/namo-api:${{ github.sha }}
          only-severities: critical
