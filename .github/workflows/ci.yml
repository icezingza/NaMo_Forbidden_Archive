name: NaMo ACC CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Run pytest
        run: pytest --cov=. --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          # This token is not a secret, it's a public identifier for the repo on Codecov
          # Replace with your actual token if you have one.
          token: ${{ secrets.CODECOV_TOKEN }}

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config

  docker-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, memory]
        include:
          - service: api
            dockerfile: Dockerfile
          - service: memory
            dockerfile: Dockerfile.memory
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: namo-${{ matrix.service }}:test

      - name: Test Docker image startup
        run: |
          docker run --rm namo-${{ matrix.service }}:test python -m pytest --version

      - name: Scan with Docker Scout
        uses: docker/scout-action@v1
        continue-on-error: true # Do not fail build if scout has issues
        with:
          image: namo-${{ matrix.service }}:test
          only-severities: critical,high

  docker-push:
    needs: [test, validate-compose, docker-build-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push main image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/namo-api:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/namo-api:${{ github.sha }}
      - name: Build and push memory image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.memory
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/namo-memory:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/namo-memory:${{ github.sha }}
