name: NaMo ACC CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Run LLM Optimization Suite Unit Tests
      run: |
        PYTHONPATH=. python -m pytest tests/test_llm_optimization.py

    - name: Run Media Asset Cache Unit Tests
      run: |
        PYTHONPATH=. python -m pytest tests/test_media_cache.py
