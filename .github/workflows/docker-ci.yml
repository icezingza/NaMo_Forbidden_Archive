name: NaMo ACC CI Pipeline

on:
  push:
    branches: [clean-main, main, master]
  pull_request:
    branches: [clean-main, main, master]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install black pytest pytest-asyncio

      - name: Run Black Check
        run: |
          black --check \
            server.py \
            app.py \
            main.py \
            rinlada_fusion.py \
            seraphina_ai_complete.py \
            core \
            adapters \
            emotion_fusion_engine \
            tests

      - name: Run Existing Unit Tests
        run: |
          PYTHONPATH=. python -m pytest \
            tests/test_server.py \
            tests/test_model_router.py \
            tests/test_omega_engine.py \
            tests/test_context_allocator.py \
            tests/test_smoke.py
