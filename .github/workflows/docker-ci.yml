name: NaMo ACC CI Pipeline

on:
  push:
    branches: [clean-main, main, master]
  pull_request:
    branches: [clean-main, main, master]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          docker run --rm \
            --entrypoint sh \
            namo:test \
            -c "pip install -r requirements-dev.txt \
                && ruff check . \
                && black --check . \
                && pytest --cov --cov-report=term-missing \
                && bandit -r . \
                && pip-audit -r requirements.txt"

      - name: Security scan with Docker Scout
        # Non-blocking: Docker Scout needs an entitled account to authenticate.
        # Report findings when available, but never fail the build on scan access.
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          image: namo:test
          only-severities: critical,high

  docker-build-push:
    needs: docker-build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: icezingza
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run Black Check
        run: |
          black --check \
            server.py \
            app.py \
            main.py \
            rinlada_fusion.py \
            seraphina_ai_complete.py \
            core \
            adapters \
            emotion_fusion_engine \
            tests

      - name: Run Existing Unit Tests
        run: |
          PYTHONPATH=. python -m pytest \
            tests/test_server.py \
            tests/test_model_router.py \
            tests/test_omega_engine.py \
            tests/test_context_allocator.py \
            tests/test_smoke.py
